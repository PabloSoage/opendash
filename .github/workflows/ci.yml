name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The one that must pass: does it build and do the captures replay?
      - run: cargo test --all-targets

      # Strict formatting and linting
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Missing translations and mismatched placeholders are silent until
      # someone switches language, so they are checked here instead.
      - run: node tools/check-resources.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # -Popendash.rust=false: no NDK and no cargo-ndk on the runner, and
      # nothing in the app loads the native library yet. What this job is for is
      # catching a Kotlin or resource break, and that still happens.
      - run: gradle :android:assembleDebug -Popendash.rust=false --no-daemon
