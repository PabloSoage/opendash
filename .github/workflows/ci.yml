name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # The one that must pass: does it build and do the captures replay?
      - run: cargo test --all-targets

      # Advisory until someone has run `cargo fmt` and `cargo clippy --fix`
      # once on a machine with the toolchain. The core was written on a host
      # without Rust installed, so its formatting has never seen rustfmt.
      - run: cargo fmt --check
        continue-on-error: true
      - run: cargo clippy --all-targets
        continue-on-error: true
